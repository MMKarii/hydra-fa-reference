site_name: Hydra Professional Reference
site_description: Professional English Hydra documentation for authorized password auditing, controlled authentication testing, labs, and defensive validation
site_author: MMKarii
repo_url: https://github.com/MMKarii/hydra-fa-reference
repo_name: MMKarii/hydra-fa-reference
edit_uri: edit/main/docs/en/
docs_dir: docs/en
site_dir: site/en
copyright: CC BY 4.0 · MMKarii

theme:
  name: material
  custom_dir: overrides
  language: en
  direction: ltr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang:
        - en
        - fa
      separator: '[\s\-\u200c،؛,;:()/]+'

extra:
  canonical_base: https://github.com/MMKarii/hydra-fa-reference/blob/main/docs/en/
  social_image_url: https://raw.githubusercontent.com/MMKarii/hydra-fa-reference/main/assets/social-preview-v1.png
  alternate:
    - name: فارسی
      link: https://github.com/MMKarii/hydra-fa-reference/blob/main/docs/fa/index.md
      lang: fa
    - name: English
      link: https://github.com/MMKarii/hydra-fa-reference/blob/main/docs/en/index.md
      lang: en

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Start Here:
      - Learning Path: learning-path.md
      - Cheat Sheet: cheatsheet.md
      - Bilingual Glossary: glossary.md
  - Fundamentals:
      - "1. Hydra Fundamentals": 01-introduction.md
      - "2. Installation and Verification": 02-installation.md
      - "3. Syntax and Command Structure": 03-syntax.md
      - "4. Credential Inputs": 04-credential-inputs.md
  - Labs:
      - "5. SSH Lab": 05-ssh-lab.md
      - "6. FTP Lab": 06-ftp-lab.md
      - "7. HTTP/HTTPS Forms": 07-http-form-basics.md
      - "8. Login Result Detection": 08-login-result-detection.md
  - Operations and Defense:
      - "9. Protocol Overview": 09-protocol-overview.md
      - "10. Safe Lab Operation": 10-safe-lab-operation.md
      - "11. Output and Reporting": 11-output-reporting.md
      - "12. Defensive Controls": 12-defensive-controls.md
  - Analysis:
      - "13. Troubleshooting": 13-troubleshooting.md
      - "14. Common Mistakes": 14-common-mistakes.md
  - References: references.md
  - Disclaimer: disclaimer.md
