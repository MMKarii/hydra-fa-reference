name: Broken link
description: Report a broken internal, anchor, or external documentation link.
title: "[Broken link] "
body:
  - type: input
    id: page
    attributes:
      label: Page containing the link
      placeholder: docs/en/references.md
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Broken link or anchor
      placeholder: https://example.org/reference or #section-name
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the HTTP status or browser behavior if known.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected destination
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I did not include private assessment targets, credentials, or sensitive customer information.
          required: true
