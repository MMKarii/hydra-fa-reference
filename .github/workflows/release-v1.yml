name: release-v1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_SHA: a5be833cbdbeabd6a127727380ae032f8bc0e325
    steps:
      - uses: actions/checkout@v4

      - name: Publish v1.0.0 Bilingual Edition
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v1.0.0 already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title 'v1.0.0 - Bilingual Edition' \
            --notes-file .github/release-notes/v1.0.0.md
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url,targetCommitish
