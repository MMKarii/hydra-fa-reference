name: asset-probe

on:
  push:
    branches:
      - hydra-docs-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe temporary transfer client
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://firestorage.ai'
          curl -fsSL "$BASE/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js" -o chunk.js
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('chunk.js').read_text(encoding='utf-8',errors='replace')
          print('chunk-bytes',len(text))
          terms=['/api/','fetch(','download','share','file','signed','presign']
          for term in terms:
              print('\nTERM',term)
              for m in list(re.finditer(re.escape(term),text,re.I))[:30]:
                  a=max(0,m.start()-220); b=min(len(text),m.end()+420)
                  print(text[a:b][:700])
          urls=sorted(set(re.findall(r'["\']([^"\']*(?:api|download)[^"\']*)["\']',text,re.I)))
          print('\nCANDIDATES')
          for u in urls[:100]: print(u)
          PY
