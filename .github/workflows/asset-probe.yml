name: asset-probe

on:
  push:
    branches:
      - hydra-docs-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe temporary transfer page
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -A 'Mozilla/5.0' 'https://firestorage.ai/ja/f/olrhyqzSP7nM' -o page.html
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('page.html').read_text(encoding='utf-8', errors='replace')
          print('page-bytes', len(text.encode()))
          for u in sorted(set(re.findall(r'https?://[^"\'<> ]+|href=["\']([^"\']+)', text))):
              print(u)
          print('webp refs:', re.findall(r'[^"\'<> ]+\.webp[^"\'<> ]*', text)[:20])
          print('download refs:', [x for x in re.findall(r'[^"\'<> ]+', text) if 'download' in x.lower()][:30])
          PY
