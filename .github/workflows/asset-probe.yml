name: asset-probe

on:
  push:
    branches:
      - hydra-docs-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe temporary transfer page
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -A 'Mozilla/5.0' 'https://firestorage.ai/ja/f/olrhyqzSP7nM' -o page.html
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('page.html').read_text(encoding='utf-8', errors='replace')
          print('page-bytes', len(text.encode()))
          for key in ['olrhyqzSP7nM','pCbY1LLMZYMrJkxX','01a0a8ba99d47715a7c21947ab85d2e2','brand-banner','api/','download','shareId','publicId','subdir']:
              print('\nKEY', key)
              for m in list(re.finditer(re.escape(key), text, re.I))[:20]:
                  a=max(0,m.start()-240); b=min(len(text),m.end()+400)
                  print(text[a:b].replace('\n',' ')[:800])
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', text)
          print('\nSCRIPTS')
          for s in scripts: print(s)
          PY
